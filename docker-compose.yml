services:
  db:
    image: postgres:16
    container_name: taskmanager-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: tasksdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d tasksdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: taskmanager-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://admin:secret@db:5432/tasksdb
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data: